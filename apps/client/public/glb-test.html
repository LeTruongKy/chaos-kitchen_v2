<!DOCTYPE html>
<html>
<head><title>GLB Test</title></head>
<body style="margin:0;background:#222">
<div id="info" style="position:absolute;top:10px;left:10px;color:lime;font-family:monospace;z-index:999"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

const info = document.getElementById('info');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(3, 3, 3);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.GridHelper(10, 10));

const loader = new GLTFLoader();
const models = ['tomato.glb', 'kitchenCabinet.glb', 'kitchenStove.glb', 'kitchenSink.glb'];
let x = -2;
let log = '';

for (const m of models) {
  loader.load('/assets/models/' + m, (gltf) => {
    log += 'OK: ' + m + ' children=' + gltf.scene.children.length + '\n';
    info.innerText = log;
    gltf.scene.position.x = x;
    x += 1.5;
    scene.add(gltf.scene);
  }, undefined, (err) => {
    log += 'FAIL: ' + m + '\n';
    info.innerText = log;
  });
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
