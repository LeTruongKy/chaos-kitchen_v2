services:
  - type: web
    name: chaos-kitchen-server
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @kitchen/server build
    startCommand: pnpm --filter @kitchen/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false
